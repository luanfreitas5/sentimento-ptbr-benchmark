# =============================================================================
# paths.yaml — caminhos de dados, modelos e saídas (relativos à raiz do projeto).
# Resolvidos para pathlib.Path em src/config/paths.py.
# =============================================================================

data:
  bronze: data/bronze         # corpora como recebidos (.csv) — imutável, nunca modificar
  silver: data/silver         # corpora limpos, tipados e validados (.parquet)
  gold: data/gold             # splits treino/teste prontos para modelagem (.parquet)

models: models                # modelos treinados por domínio
reports:
  root: reports
  figures: reports/figures
  metrics: reports/metrics
  model_cards: reports/model_cards
  datasheets: reports/datasheets

logs: logs
mlruns: mlruns                # diretório do banco SQLite do MLflow (mlflow.db)
