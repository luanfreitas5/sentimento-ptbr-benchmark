# =============================================================================
# logging.yaml — configuração do logger (console rich + arquivo rotativo).
# Consumido por src/config/logging.py.
# =============================================================================

level: INFO                 # DEBUG | INFO | WARNING | ERROR | CRITICAL
file_format: "%(asctime)s \t %(levelname)s \t %(name)s \t %(message)s"
date_format: "%Y-%m-%d %H:%M:%S"

console:
  enabled: true
  show_path: true
  rich_tracebacks: true

file:
  enabled: true
  directory: logs
  filename_pattern: "log_%Y-%m-%d.log"   # rotação diária
  when: midnight
  backup_count: 14
  encoding: utf-8
